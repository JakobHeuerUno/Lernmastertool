[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lern"
version = "0.1.0"
description = "Lernstand-Tool der LERNECKE (Fortschritt, Fehlerbuch, Anki, Dashboard)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "pymupdf>=1.24",   # enthält seit 2.0 auch pymupdf4llm
    "genanki>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lern = "lern.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
